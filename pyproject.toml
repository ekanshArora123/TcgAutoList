[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcgautolist"
version = "1.0.0"
description = "Agentic Pokemon card eBay listing system (Python)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "mcp>=1.0",
    "python-telegram-bot>=21.0",
    "python-dotenv>=1.0",
    "flask>=3.0",
    "flask-cors>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# Each microservice is its own top-level package. Because the card-server
# directory name contains a hyphen (not a valid Python identifier), the
# package lives in services/card-server/card_server and is mapped explicitly.
[tool.setuptools]
packages = [
    "card_server",
    "card_server.helpers",
    "card_server.helpers.crud",
    "card_server.helpers.pricing",
    "card_server.helpers.tcgplayer",
    "card_server.helpers.market",
    "card_server.services",
    "telegram_service",
    "ebay_service",
    "orchestrator",
    "shared",
]

[tool.setuptools.package-dir]
card_server = "services/card-server/card_server"
telegram_service = "services/telegram"
ebay_service = "services/ebay"
orchestrator = "dashboard/backend/orchestrator"
shared = "shared"
