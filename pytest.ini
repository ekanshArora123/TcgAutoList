[pytest]
# Register custom markers and keep the default run network-free.
#
# `external` = live tests that hit third-party APIs (TCGplayer). Pricing depends
# on TCGplayer's undocumented internal APIs, which can change shape with no code
# change on our side and silently break production pricing. Those tests are a
# scheduled canary, NOT a per-commit gate.
#
# addopts excludes them from the default run, so `pytest -q` locally and the
# per-commit CI job never touch the network. The scheduled CI job re-includes
# them with `pytest -m external` (a command-line -m overrides the one here).
markers =
    external: live tests against third-party APIs (TCGplayer). Excluded by default; run with `pytest -m external`.

addopts = -m "not external"
