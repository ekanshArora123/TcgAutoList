# TcgAutoList CI
#
# Branch workflow: feature branches -> PR into main -> merge. Nothing is
# committed directly to main.
#
#   - PR into main      -> run the Test stage (gate the merge). No deploy.
#   - Push to main      -> run Test, then Deploy (post-merge).
#   - Scheduled/manual  -> live TCGplayer API contract check (ExternalChecks).
#
# Feature-branch pushes trigger nothing (trigger is main-only); validation
# happens on the PR. Pricing rides on TCGplayer's undocumented internal APIs,
# which can break with no change to our code, so the scheduled canary probes
# them on a timer (a failing run notifies via ADO's build alerts).

trigger:
  branches:
    include:
      - main

# PR validation: run the pipeline on pull requests targeting main so tests gate
# the merge and main stays green/deployable. (GitHub-connected pipeline; PR
# triggers come from the YAML.) Deploy is excluded on PRs via its condition.
pr:
  branches:
    include:
      - main

# Daily canary for the external API. `always: true` runs it even when nothing
# changed — the whole point is to catch TCGplayer-side drift. Cron is UTC.
schedules:
  - cron: "0 13 * * *"
    displayName: Daily TCGplayer API contract check
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest   # tests are pure-Python + in-memory SQLite; OS-agnostic

variables:
  # Secrets (TCGPLAYER_AUTH_COOKIE, TELEGRAM_*, EBAY_*) live in a variable group
  # (Pipelines > Library, ideally backed by Azure Key Vault), shared across
  # pipelines and masked in logs. NOTE: this name must match your group exactly.
  - group: tcgautolist-secrets
  - name: pythonVersion
    value: '3.11'
  - name: nodeVersion
    value: '20.x'

stages:
  # ── Per-commit: unit tests + frontend build (skipped on scheduled runs) ──
  - stage: Test
    displayName: 'Unit tests + frontend'
    condition: ne(variables['Build.Reason'], 'Schedule')
    jobs:
      - job: Backend
        displayName: 'Backend (pytest)'
        steps:
          - template: yamlTemplates/pythonTemplate.yml
            parameters:
              pythonVersion: $(pythonVersion)
              displayName: 'Run unit tests'        # default args -> excludes `external`

      - job: Frontend
        displayName: 'Frontend build'
        steps:
          - template: yamlTemplates/nodeTemplate.yml
            parameters:
              nodeVersion: $(nodeVersion)

  # ── Scheduled (or manual): live TCGplayer contract check ──
  - stage: ExternalChecks
    displayName: 'Live TCGplayer API contract'
    dependsOn: []          # independent: must still run when Test is skipped (schedule)
    condition: in(variables['Build.Reason'], 'Schedule', 'Manual')
    jobs:
      - job: TcgplayerContract
        displayName: 'TCGplayer contract (pytest -m external)'
        steps:
          - template: yamlTemplates/pythonTemplate.yml
            parameters:
              pythonVersion: $(pythonVersion)
              pytestArgs: '-m external'            # command-line -m overrides pytest.ini
              displayName: 'Run external API contract tests'
              # Map secrets -> env so live tests can authenticate. Secret variables
              # are NOT exposed to scripts automatically; they must be mapped here.
              # The auth-cookie test verifies paginated sales retrieval; without the
              # cookie it skips. Uncomment telegram/ebay as those externals land.
              env:
                TCGPLAYER_AUTH_COOKIE: $(TCGPLAYER_AUTH_COOKIE)
                # TELEGRAM_BOT_TOKEN: $(TELEGRAM_BOT_TOKEN)
                # TELEGRAM_CHAT_ID: $(TELEGRAM_CHAT_ID)
                # EBAY_CLIENT_ID: $(EBAY_CLIENT_ID)
                # EBAY_CLIENT_SECRET: $(EBAY_CLIENT_SECRET)
                # EBAY_ENVIRONMENT: $(EBAY_ENVIRONMENT)

  # ── Deploy: only on a real push/merge to main (never on PRs or schedule) ──
  - stage: Deploy
    dependsOn: Test
    condition: >-
      and(
        succeeded(),
        ne(variables['Build.Reason'], 'Schedule'),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/main')
      )
    jobs:
      - job: deploy_vercel
        pool: { vmImage: ubuntu-latest }
        steps:
          - script: npm install --global vercel@latest
          - script: vercel pull --yes --environment=production
            env:
              VERCEL_TOKEN: $(VERCEL_TOKEN)
              VERCEL_ORG_ID: $(VERCEL_ORG_ID)
              VERCEL_PROJECT_ID: $(VERCEL_PROJECT_ID)
          - script: vercel build --prod
            env: { VERCEL_TOKEN: $(VERCEL_TOKEN) }
          - script: vercel deploy --prebuilt --prod
            env: { VERCEL_TOKEN: $(VERCEL_TOKEN) }
